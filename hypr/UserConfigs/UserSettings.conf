# User Settings

# Hyprland Wiki Links
# Input - https://wiki.hyprland.org/Configuring/Variables/#input

input {
  accel_profile = flat # disable mouse acceleration
}

general {
  layout = scrolling # default to the scrolling layout (still swappable via Super+Alt+1-4)
}

gestures {
  gesture = 3, up, unset # disable three finger swipe-up zoom in
  gesture = 3, horizontal, unset # free up 3-finger horizontal (was workspace swipe)
  gesture = 4, horizontal, workspace # switch workspaces with 4-finger swipe
  gesture = 3, horizontal, scroll_move # scroll through windows (scrolling layout) with 3-finger swipe
}

# Start KWallet so apps using the Secret Service API (e.g. Brave sync) can
# find a keyring outside of a KDE session
exec-once = kwalletd6
